<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Construction AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2f2f2;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: #f2f2f2;
    }

    #ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border: none;
      border-radius: 30px;
      background: black;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <model-viewer
    src="house.glb"
    alt="3D House Model"
    camera-controls
	camera-target="0m 1.5m 0m"
 	camera-orbit="0deg 75deg auto"
    touch-action="pan-y"
      shadow-intensity="1"
    exposure="1"
    ar
    ar-modes="webxr scene-viewer quick-look">

    <button slot="ar-button" id="ar-button">
      View in AR
    </button>

  </model-viewer>

</body>
</html>
